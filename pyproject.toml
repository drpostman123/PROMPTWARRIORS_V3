[project]
name = "godmode0dte"
version = "0.1.0"
description = "GodMode0DTE — extremely selective, defined-risk 0DTE debit-vertical system for Tastytrade (paper mode first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tastytrade>=9.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.optional-dependencies]
hmm = ["hmmlearn>=0.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "freezegun>=1.4"]

[project.scripts]
godmode = "godmode0dte.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["godmode0dte*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
