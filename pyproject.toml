[project]
name = "promptwarriors-trading"
version = "0.2.0"
description = "Trading systems monorepo: GodMode0DTE (Tastytrade 0DTE verticals) + SKYFIRE_SOL (Solana momentum rotation) over the shared tradecore skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tastytrade>=9.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.20",
    "solders>=0.21",
    "solana>=0.34",
    "aiosqlite>=0.20",
    "rich>=13.7",
    "pyrage>=1.1",
    "base58>=2.1",
    "hyperliquid-python-sdk>=0.24",
]

[project.optional-dependencies]
hmm = ["hmmlearn>=0.3"]
perps = ["driftpy>=0.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "freezegun>=1.4"]

[project.scripts]
godmode = "godmode0dte.__main__:main"
skyfire = "skyfire_sol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["godmode0dte*", "tradecore*", "skyfire_sol*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
