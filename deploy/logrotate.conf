# Logrotate policy for GodMode0DTE.
# Install: cp deploy/logrotate.conf /etc/logrotate.d/godmode
#
# TWO DIFFERENT ROTATION MECHANICS — this distinction is load-bearing:
#
# 1) logs/godmode.jsonl is written through a logging.FileHandler opened ONCE at
#    boot (monitoring/logging.py). Rename-based rotation would leave the
#    process appending to the renamed inode forever, so this file MUST use
#    copytruncate. (Accepted trade-off: copytruncate can drop lines written in
#    the copy->truncate window; for an ops log that is fine.)
#
# 2) state/*.jsonl are appended via `with path.open("a")` per record
#    (state/store.py StateStore._append) — the file is reopened on every write,
#    so plain rename+create rotation is lossless here. Do NOT copytruncate
#    these: they are calibration data and must not lose records.
#
# state/snapshot.json is a 2s-cadence overwrite (atomic tmp+rename), never
# grows, and must NOT be rotated.

/opt/godmode/logs/godmode.jsonl {
    daily
    rotate 30
    maxsize 200M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    dateext
    su godmode godmode
}

# decisions.jsonl: one full score snapshot per 1-minute bar while SCANNING
# (~350 records/day, each with the complete component breakdown) plus every
# rejection — the fastest-growing file in state/. Weekly keeps any single file
# small enough for scripts/backtest_imbalance.py; 26 weeks retained,
# compressed. Point backtests at state/decisions.jsonl* when you need history.
/opt/godmode/state/decisions.jsonl {
    weekly
    rotate 26
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0640 godmode godmode
    su godmode godmode
}

# trades.jsonl: a handful of lines per traded day; rotation is a size
# backstop only. NOTE: after a rotation the dashboard's cumulative-P&L chart
# and StateStore.read_trades() only see the current file — rotate rarely.
/opt/godmode/state/trades.jsonl {
    yearly
    rotate 10
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0640 godmode godmode
    su godmode godmode
}
