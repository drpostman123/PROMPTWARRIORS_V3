# GodMode0DTE configuration.
# Hard risk ceilings are enforced in code (config can tighten, never loosen):
#   per-trade <= 4% equity, heat <= 7%, <= 2 positions, daily loss <= 6%.

paper_mode: false           # LIVE. Arming interlock: also export GODMODE_CONFIRM_LIVE=YES
account_index: 0
timezone: America/New_York

risk:
  max_trade_risk_pct: 4.0
  max_heat_pct: 7.0
  max_concurrent_positions: 2
  daily_loss_limit_pct: 6.0
  min_equity: 2000
  max_data_staleness_sec: 5
  min_intent_spacing_sec: 60
  lockout_file: state/lockout.json
  # Phase A launch ladder (docs/DESIGN_SPEC.md §2.1): flat 2% of equity.
  # Phase B {93: 0.5, 97: 0.75} and C {93: 0.5, 97: 1.0} unlock only after
  # the calibration gates in the spec are met.
  sizing_ladder:
    93: 0.50

signal:
  min_score: 93             # compiled floor is 90; may only be raised
  weights:                  # arbitrated weights (spec §1.2); must sum to 100.
    opening_range: 20       # micro + event carry 0 points — they are hard
    breakout_confirmation: 25   # gates, not alpha.
    mtf_alignment: 21
    regime: 20
    macro_cluster: 8
    event_sentiment: 0
    dow_vix_preference: 6
    microstructure: 0
  or_min_width_pct: 0.07
  or_max_width_pct: 0.40
  or_max_width_atr_mult: 1.2
  breakout_buffer_pct: 0.03
  min_rel_volume: 1.3
  min_close_location: 0.75
  max_chase_frac: 0.50        # G-S4: refuse breakouts already >50% of OR width past the edge
  breakout_decay_min: 30      # breakout points decay to zero over 30 minutes
  entry_window_start: "09:50:00"   # regime needs 4 closed 5m bars
  entry_window_end: "11:30:00"
  min_regime_confidence: 0.70
  vix_sweet_low: 14
  vix_sweet_high: 22
  vix_hard_max: 32
  dow_points: {mon: 0, tue: 0, wed: 0, thu: 0, fri: 0}   # earn weight via calibration only

  # Order-book layer: I = (Vbid - Vask)/(Vbid + Vask) at the inside market.
  # Zero score weight (logged every bar; run scripts/backtest_imbalance.py to
  # test whether it earns points). Gates fire on conflict or thinning.
  book_gate_enabled: true
  book_conflict_threshold: 0.30   # gate when EWMA I opposes the trade beyond this
  book_ewma_alpha: 0.10
  book_thin_frac: 0.35            # gate when depth < 35% of rolling median

events:
  blackout_before_min: 30
  blackout_after_min: 15
  fomc_day_lockout: true
  calendar_file: config/econ_calendar.yaml

execution:
  underlying: SPY           # SPY | SPX | AUTO
  long_delta_min: 0.45      # target 0.50 (spec §6.2)
  long_delta_max: 0.60
  width_strikes_spy: 2
  width_points_spx: 20
  min_debit_pct_of_width: 0.30
  max_debit_pct_of_width: 0.42   # acceptance at mid; ladder cap below keeps RR >= 1.22
  ladder_cap_pct_of_width: 0.45
  max_leg_spread_pct_of_mid: 10.0
  max_leg_spread_abs: 0.05
  min_open_interest: 500
  quote_staleness_sec: 1.5
  ladder_step_frac: 0.15
  ladder_step_wait_sec: 4
  ladder_max_steps: 4
  entry_abandon_sec: 30

exits:                       # arbitrated priority table (spec §7)
  # NYSE 13:00 ET early closes — VERIFY against the exchange calendar each
  # January; on these dates force_flat shifts to 12:30 automatically.
  early_close_dates:
    - 2026-11-27             # day after Thanksgiving
    - 2026-12-24             # Christmas Eve
    - 2027-11-26             # day after Thanksgiving
  profit_target_mult: 1.65   # P4a: 1.65 x debit ...
  profit_target_width_frac: 0.80   # ... capped at 0.80 x width
  hard_stop_pct: 50          # P3, on 2 consecutive spread marks
  max_hold_min: 90           # P5
  stale_flush: "14:50:00"    # P5 losing flush
  force_flat: "15:30:00"     # P1, unconditional
  structure_stop: true       # P4b

data:
  bar_seconds: 60
  snapshot_path: state/snapshot.json
  trade_log_path: state/trades.jsonl
  decision_log_path: state/decisions.jsonl
