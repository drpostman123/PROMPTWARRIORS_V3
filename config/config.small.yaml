# GodMode0DTE — small-account profile ($3k-$25k). Start with:
#   godmode --config config/config.small.yaml
#
# Arithmetic this profile encodes (round-4 audit, docs/SMALL_ACCOUNTS.md):
#   - 1 SPY contract at worst fill $0.90 + $2.60 fees = $92.60
#     -> needs $2,315 at the 4% cap (one-lot rule), $4,630 at the Phase-A 2% target
#   - two concurrent 1-lots under the 7% heat cap -> $2,646
#   - a -6% day from $3,000 leaves $2,820: still above the one-lot floor
#   - SPX needs ~$23k+ even at the one-lot minimum: rejected at config load
#   - real per-trade risk runs 2.0-4.0% (not 2%) until ~$4,600 because one
#     contract IS the position; the dashboard shows risk_pct_actual per trade
#
# PDT: eliminated effective 2026-06-04, but broker phase-in runs to Oct 2027.
# If your broker still enforces a day-trade counter, set account_type:
# margin_small below and the governor budgets 3 round trips per 5 business days.

paper_mode: false
account_index: 0
timezone: America/New_York

risk:
  max_trade_risk_pct: 4.0
  max_heat_pct: 7.0
  max_concurrent_positions: 2
  daily_loss_limit_pct: 6.0
  min_equity: 3000
  allow_one_lot_minimum: true
  fee_floor_mult: 5.0
  daily_trade_cap: 3
  account_type: margin_large      # margin_small if your broker still counts day trades
  day_trades_per_5d: 3
  day_trade_file: state/day_trades.json
  sizing_ladder:
    93: 0.50

execution:
  underlying: SPY                 # SPX is structurally unsizeable at this scale
  friction_per_contract: 2.60
